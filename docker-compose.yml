# Self-hosting stack: web app, queue worker, scheduler and MySQL.
#
#   cp .env.example .env     (then set APP_KEY, DB_PASSWORD and APP_URL)
#   docker compose up -d
#   docker compose exec app php artisan quests:create-admin
#
# The same file runs on Dokploy (turn on "Isolated Deployment" for the service, then add your domain
# to the `app` service on port 8080 in the Domains tab). Local development uses compose.sail.yaml.
#
# The app's host port is bound to 127.0.0.1 by default, so only a reverse proxy on the same host
# can reach it. Set WEB_BIND=0.0.0.0 only for a quick test without a proxy, or for a proxy on
# another machine with a firewall that only lets that proxy in.
#
# All three app services use one image, built from the Dockerfile, and read the same .env file.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: quest-board:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    # Uploaded logos and files; survives redeploys.
    - app-storage:/var/www/html/storage/app

services:
  app:
    <<: *app
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    environment:
      # serversideup automations: migrate --force, caches and storage:link on every start (this service only)
      AUTORUN_ENABLED: 'true'
      # Laravel's health route; the image's built-in healthcheck calls it
      HEALTHCHECK_PATH: /up
      PHP_OPCACHE_ENABLE: '1'
      # Stop early with a clear message instead of starting without a key
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env (see .env.example)}
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    <<: *app
    command: ['php', '/var/www/html/artisan', 'queue:work', '--tries=3']
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'healthcheck-queue']
      start_period: 10s
    environment:
      AUTORUN_ENABLED: 'false'
      PHP_OPCACHE_ENABLE: '1'
    depends_on:
      mysql:
        condition: service_healthy
      # Wait for the app, which runs the migrations the queue table needs
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ['php', '/var/www/html/artisan', 'schedule:work']
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'healthcheck-schedule']
      start_period: 10s
    environment:
      AUTORUN_ENABLED: 'false'
      PHP_OPCACHE_ENABLE: '1'
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-quest_board}
      MYSQL_USER: ${DB_USERNAME:-quest}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  app-storage:
  mysql-data:
